aid: zencoder
name: Zencoder
description: >-
  Zencoder is a cloud-based video and audio encoding (transcoding) platform, now part of Brightcove,
  that turns source media into web-, mobile-, and broadcast-ready outputs at scale. Its REST API lets
  developers submit encoding jobs, generate multiple simultaneous outputs (MP4, HLS, DASH, HEVC/H.265,
  VP9, 4K/UHD, HDR10), apply captions, watermarks, clips, and thumbnails, protect content with DRM and
  encryption, and receive completion notifications via webhooks. Zencoder is known for its Emmy
  Award-winning Context Aware Encoding (CAE), no queue time, and per-minute usage-based pricing. The
  v2 API is organized around Jobs, Inputs, Outputs, Accounts, and Reports resources and authenticates
  with a Zencoder-Api-Key header (also accepted as an api_key query parameter). Originally an
  a16z / GV / 500 Global-backed startup, Zencoder was acquired by Brightcove and its API is documented
  and supported under the Brightcove developer surface.
